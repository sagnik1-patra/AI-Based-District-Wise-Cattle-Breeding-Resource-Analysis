    SAS Nagar: 17
    SBS Nagar: 18
    Sangrur: 19
    Sri Muktsar Sahib: 20
    Tarn Taran: 21
  features:
  - Year
  - Lag_1
  - Lag_2
  - Lag_3
  - Moving_Average_3
  - Previous_Change
  - District_Code
  lags: 3
models:
  random_forest:
    n_estimators: 250
    max_depth: 12
    min_samples_leaf: 2
  neural_network:
