    Resource Analysis
  target: Animal_Count
data:
  first_year: 1971
  last_year: 2018
  districts:
  - Amritsar
  - Barnala
  - Bathinda
  - Faridkot
  - Fatehgarh Sahib
  - Fazilka
  - Ferozpur
  - Gurdaspur
  - Hoshiarpur
  - Jalandhar
  - Kapurthala
  - Ludhiana
  - Mansa
  - Moga
  - Pathankot
  - Patiala
  - Rupnagar
  - SAS Nagar
  - SBS Nagar
  - Sangrur
  - Sri Muktsar Sahib
  - Tarn Taran
  district_mapping:
    Amritsar: 0
    Barnala: 1
    Bathinda: 2
    Faridkot: 3
    Fatehgarh Sahib: 4
    Fazilka: 5
    Ferozpur: 6
    Gurdaspur: 7
    Hoshiarpur: 8
    Jalandhar: 9
    Kapurthala: 10
    Ludhiana: 11
    Mansa: 12
    Moga: 13
    Pathankot: 14
    Patiala: 15
