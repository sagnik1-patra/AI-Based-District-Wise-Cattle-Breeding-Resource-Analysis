    - 64
    - 32
    - 16
    learning_rate: 0.001
    batch_size: 16
    maximum_epochs: 200
evaluation:
  split_type: chronological
  train_end_year: 2001
  validation_end_year: 2008
  metrics:
  - MAE
  - RMSE
  - R2
  selected_model: Neural_Network
artifacts:
  keras_model: cattle_breeding_model.h5
  random_forest: cattle_breeding_model.pkl
  preprocessing: preprocessing.pkl
  metrics: metrics.json
